<title>Cockpit GP 모델 랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: studio turntable filling the screen; one control sheet top-left (bottom sheet on phones), stats top-right. Single dark look. */
:root{
  --panel:rgba(12,13,16,.84); --fg:#f3f2ee; --muted:#9ba1aa; --line:rgba(255,255,255,.14); --chip:#17191e;
  --red:#e10600; --amber:#ffc83d;
  --display:"Titillium Web","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#101114;color:var(--fg);overflow:hidden;font-family:var(--display)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(8px)}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#ui{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;width:310px;max-height:calc(100% - 32px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;z-index:2}
#ui h1{margin:0;font-size:24px;font-weight:900;line-height:1.1;text-wrap:balance}
#ui h1 span{color:var(--red)}
#ui p{margin:0;font-size:13px;line-height:1.5;color:#cfd0cc}
.sec{display:flex;flex-direction:column;gap:7px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg button,.tog{font:700 13px var(--display);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:8px 6px;cursor:pointer}
.seg button[aria-pressed="true"],.tog[aria-pressed="true"]{border-color:var(--red);background:rgba(225,6,0,.2)}
.seg.big button{font-size:15px;padding:10px 6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--red)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:4px}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#stats{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;padding:10px 14px;z-index:2;display:grid;grid-template-columns:auto auto;gap:3px 14px;align-items:baseline;pointer-events:none}
#stats .v{text-align:right;font-size:15px;font-weight:600}
#parts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;max-width:360px;padding:10px 14px;z-index:2;font-size:12px;line-height:1.5;color:#cfd0cc;pointer-events:none}
#parts b{color:var(--fg)}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center}
@media (max-width:700px){
  #ui{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;width:auto;max-height:46%;padding:12px;gap:10px}
  #ui h1{font-size:20px} #ui p{display:none}
  #parts{display:none}
  #stats{top:calc(10px + env(safe-area-inset-top,0px));right:10px;padding:8px 10px}
}
</style>

<canvas id="gl"></canvas>
<div id="ui" class="panel">
  <div class="sec">
    <div class="lbl">Cockpit GP · 모델 랩</div>
    <h1>코드로만 만든 <span>F1 머신</span></h1>
    <p>이미지나 3D 파일 없이 Three.js 코드만으로 만든 차입니다. 현재 게임 모델과 바꿔 보며 비교하고, 와이어프레임으로 면 구조를 확인하세요.</p>
  </div>
  <div class="sec"><div class="lbl">모델</div><div class="seg big" id="segM"></div></div>
  <div class="sec"><div class="lbl">보는 방향</div><div class="seg wrap" id="segV"></div></div>
  <div class="sec"><div class="lbl">도색</div><div class="swatches" id="sw"></div></div>
  <div class="sec"><div class="lbl">표시</div><div class="toggles"><button class="tog" id="tWire" type="button" aria-pressed="false">와이어프레임</button><button class="tog" id="tSpin" type="button" aria-pressed="true">자동 회전</button></div></div>
</div>
<div id="stats" class="panel">
  <div class="lbl" style="grid-column:1/-1">이 모델</div>
  <span class="lbl">삼각형</span><span class="v num" id="sTri">–</span>
  <span class="lbl">그리기 호출</span><span class="v num" id="sCall">–</span>
  <span class="lbl">FPS</span><span class="v num" id="sFps">–</span>
</div>
<div id="parts" class="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="err" class="panel">3D 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.</div>');return;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------------- renderer & studio ---------------- */
const canvas=$('gl');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err" class="panel">이 브라우저에서 WebGL을 사용할 수 없습니다.</div>');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x15171b);scene.fog=new THREE.Fog(0x15171b,14,34);
const camera=new THREE.PerspectiveCamera(35,1,.05,200);
// studio reflections: a grey room with three bright soft boxes, baked into an environment map
{const room=new THREE.Scene(),pm=new THREE.PMREMGenerator(renderer);
  room.add(new THREE.Mesh(new THREE.BoxGeometry(30,14,30),new THREE.MeshBasicMaterial({color:0x2a2c31,side:THREE.BackSide})));
  const soft=(w,h,x,y,z,ry,rx,i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(i,i,i*1.02),side:THREE.DoubleSide}));m.position.set(x,y,z);m.rotation.set(rx,ry,0);room.add(m);};
  soft(12,4,0,6.9,0,0,Math.PI/2,6);soft(6,6,-14,3,0,Math.PI/2,0,2.4);soft(6,6,14,3,4,-Math.PI/2,0,1.6);soft(10,3,0,2,-14.9,0,0,1.2);
  scene.environment=pm.fromScene(room,.02).texture;}
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(4,9,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:25});key.shadow.bias=-.0003;key.shadow.normalBias=.02;scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfe6f0,0x202226,.35));
const floor=new THREE.Mesh(new THREE.CircleGeometry(30,64),new THREE.MeshStandardMaterial({color:0x2a2c30,roughness:.45,metalness:.1}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(3.6,3.68,96),new THREE.MeshBasicMaterial({color:0x3a3d44}));ring.rotation.x=-Math.PI/2;ring.position.y=.002;scene.add(ring);

/* ---------------- textures ---------------- */
function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();if(srgb)t.encoding=THREE.sRGBEncoding;return t;}
const carbonTex=canvasTex(64,64,g=>{for(let y=0;y<8;y++)for(let x=0;x<8;x++){const odd=(x+y)%2,v=odd?40:24;g.fillStyle=`rgb(${v},${v+1},${v+4})`;g.fillRect(x*8,y*8,8,8);
  const gr=g.createLinearGradient(x*8,y*8,x*8+(odd?8:0),y*8+(odd?0:8));gr.addColorStop(0,'rgba(255,255,255,.14)');gr.addColorStop(1,'rgba(0,0,0,.22)');g.fillStyle=gr;g.fillRect(x*8,y*8,8,8);}});
carbonTex.repeat.set(10,10);
const numTex=canvasTex(128,96,g=>{g.fillStyle='#f3f2ee';g.font='900 82px "Titillium Web",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('07',64,52);});

/* ---------------- materials ---------------- */
const MAT={
  paint:new THREE.MeshPhysicalMaterial({vertexColors:true,metalness:.2,roughness:.3,clearcoat:1,clearcoatRoughness:.05}),   // lofted body (colour per vertex)
  solid:new THREE.MeshPhysicalMaterial({color:0xc4101c,metalness:.2,roughness:.3,clearcoat:1,clearcoatRoughness:.05}),      // other painted parts
  carbon:new THREE.MeshStandardMaterial({map:carbonTex,roughness:.32,metalness:.25}),
  satin:new THREE.MeshStandardMaterial({color:0x1a1b1f,roughness:.55,metalness:.3}),
  rubber:new THREE.MeshStandardMaterial({color:0x0b0b0c,roughness:.82,envMapIntensity:.45}),
  rim:new THREE.MeshStandardMaterial({color:0x26282c,metalness:.9,roughness:.25}),
  cover:new THREE.MeshPhysicalMaterial({color:0x0f1012,metalness:.4,roughness:.35,clearcoat:.6}),
  chrome:new THREE.MeshStandardMaterial({color:0xc8ccd2,metalness:1,roughness:.12}),
  yellow:new THREE.MeshStandardMaterial({color:0xf3c614,roughness:.45}),
  white:new THREE.MeshPhysicalMaterial({color:0xf1efe9,roughness:.3,clearcoat:.8}),
  visor:new THREE.MeshPhysicalMaterial({color:0x0b0c0e,metalness:.9,roughness:.04,clearcoat:1}),
  light:new THREE.MeshStandardMaterial({color:0x220000,emissive:0xff2a1a,emissiveIntensity:3}),
  number:new THREE.MeshStandardMaterial({map:numTex,transparent:true,roughness:.4}),
};

/* ---------------- geometry helpers ---------------- */
// Loft: a smooth body made by sweeping super-ellipse cross-sections along the car (z). Each key sets width, height
// above/below the centre line, centre position and roundness (n: 2 = ellipse, higher = squarer). Keys are blended with
// a Catmull-Rom curve, so the surface flows like a sculpted panel instead of meeting at hard box edges.
const PARAMS=['z','w','ht','hb','yc','xc','n'];
function loft(keys,{steps=72,seg=40,colorAt}){
  keys=keys.map(k=>({xc:0,n:2.5,...k}));const K=keys.length,cr=(a,b,c,d,f)=>.5*(2*b+(-a+c)*f+(2*a-5*b+4*c-d)*f*f+(-a+3*b-3*c+d)*f*f*f);
  const at=t=>{const i=Math.min(K-2,Math.floor(t)),f=t-i,k=[keys[Math.max(0,i-1)],keys[i],keys[i+1],keys[Math.min(K-1,i+2)]],o={};
    PARAMS.forEach(p=>o[p]=cr(k[0][p],k[1][p],k[2][p],k[3][p],f));return o;};
  const pos=[],col=[],paintIdx=[],idx=[],ring=seg+1;
  const push=(x,y,z,c)=>{pos.push(x,y,z);col.push(c[0],c[1],c[2]);if(c[3])paintIdx.push(pos.length/3-1);};
  for(let s=0;s<=steps;s++){const S=at(s/steps*(K-1)),e=2/Math.max(S.n,1.2);
    for(let j=0;j<=seg;j++){const th=j/seg*Math.PI*2,c=Math.cos(th),sn=Math.sin(th);
      const x=S.xc+S.w*Math.sign(c)*Math.pow(Math.abs(c),e),y=S.yc+(sn>=0?S.ht:S.hb)*Math.sign(sn)*Math.pow(Math.abs(sn),e);
      push(x,y,S.z,colorAt(S,th,x,y));}}
  for(let s=0;s<steps;s++)for(let j=0;j<seg;j++){const a=s*ring+j,b=a+ring,c=a+1,d=b+1;idx.push(a,c,b,c,d,b);}
  // end caps
  for(const [s,front] of [[0,true],[steps,false]]){const S=at(s/steps*(K-1)),ci=pos.length/3;push(S.xc,S.yc,S.z,colorAt(S,-Math.PI/2,S.xc,S.yc));
    for(let j=0;j<seg;j++){const a=s*ring+j;front?idx.push(ci,a+1,a):idx.push(ci,a,a+1);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();g.userData.paintIdx=paintIdx;return g;}
// cambered airfoil (inverted for downforce): chord along +z, span along x, thickness in y
function airfoil(chord,span,thick=.12,camber=-.06){const s=new THREE.Shape(),N=24,pts=[];
  for(let k=0;k<=N;k++){const x=(1-Math.cos(k/N*Math.PI))/2,yt=5*thick*(.2969*Math.sqrt(x)-.126*x-.3516*x*x+.2843*x**3-.1015*x**4),yc=camber*4*x*(1-x);pts.push([x,yc,yt]);}
  pts.forEach(([x,yc,yt],k)=>k?s.lineTo(x*chord,(yc+yt)*chord):s.moveTo(x*chord,(yc+yt)*chord));
  for(let k=N;k>=0;k--){const [x,yc,yt]=pts[k];s.lineTo(x*chord,(yc-yt)*chord);}
  const g=new THREE.ExtrudeGeometry(s,{depth:span,bevelEnabled:false,curveSegments:2});g.translate(0,0,-span/2);g.rotateY(-Math.PI/2);return g;}
// flat plate drawn in side view (z, y), thickness across x
function plate(pts,t){const s=new THREE.Shape();pts.forEach(([z,y],k)=>k?s.lineTo(-z,y):s.moveTo(-z,y));s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:true,bevelThickness:.004,bevelSize:.004,bevelSegments:1,curveSegments:8});g.translate(0,0,-t/2);g.rotateY(Math.PI/2);return g;}
// aero-section strut between two points (flattened tube)
function strut(a,b,r,flat=.4){const d=V().subVectors(b,a),g=new THREE.CylinderGeometry(r,r,d.length(),10);g.scale(1,1,flat);
  const m=new THREE.Mesh(g);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return m;}

/* ---------------- improved F1 car ---------------- */
let livery=[0xc4101c];const ACCENT=[.95,.94,.92],CARBON=[.06,.06,.07];
function hexRGB(h){const c=new THREE.Color(h).convertSRGBToLinear();return [c.r,c.g,c.b];}
function buildF1(){
  const car=new THREE.Group(),P=hexRGB(livery[0]),paintGeos=[];let parts=0;
  const add=(geo,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0,parent=car)=>{const m=geo.isMesh?geo:new THREE.Mesh(geo,mat);if(geo.isMesh)m.material=mat;
    if(!geo.isMesh){m.position.set(x,y,z);m.rotation.set(rx,ry,rz);}m.castShadow=true;m.receiveShadow=true;parent.add(m);parts++;return m;};
  const paintLoft=(keys,opts)=>{const g=loft(keys,opts);paintGeos.push(g);return add(g,MAT.paint);};
  // main body: nose → survival cell → engine cover → tail. Carbon underside, white stripe along the nose top.
  paintLoft([{z:-3.62,w:.05,ht:.04,hb:.04,yc:.27,n:2},{z:-3.3,w:.11,ht:.075,hb:.07,yc:.3,n:2.2},{z:-2.7,w:.17,ht:.1,hb:.09,yc:.35,n:2.4},
    {z:-2.0,w:.22,ht:.13,hb:.11,yc:.41,n:2.6},{z:-1.45,w:.3,ht:.17,hb:.16,yc:.45,n:3},{z:-.95,w:.38,ht:.21,hb:.22,yc:.46,n:3.4},
    {z:-.45,w:.43,ht:.2,hb:.25,yc:.46,n:3.6},{z:.05,w:.45,ht:.24,hb:.26,yc:.46,n:3.6},{z:.6,w:.4,ht:.25,hb:.26,yc:.45,n:3.2},
    {z:1.2,w:.28,ht:.21,hb:.22,yc:.42,n:2.8},{z:1.8,w:.17,ht:.15,hb:.14,yc:.38,n:2.5},{z:2.15,w:.1,ht:.1,hb:.08,yc:.36,n:2.3}],
    {colorAt:(S,th)=>{const sn=Math.sin(th),c=Math.cos(th);if(sn<-.45)return CARBON;if(S.z<-1.3&&sn>.6&&Math.abs(c)<.16)return ACCENT;return [...P,1];}});
  // airbox / roll hoop rising behind the driver
  paintLoft([{z:-.18,w:.04,ht:.02,hb:.02,yc:.68,n:2},{z:-.02,w:.14,ht:.17,hb:.03,yc:.74,n:2.6},{z:.25,w:.16,ht:.22,hb:.05,yc:.74,n:3},
    {z:.7,w:.12,ht:.13,hb:.05,yc:.7,n:2.6},{z:1.35,w:.05,ht:.04,hb:.04,yc:.6,n:2}],{seg:28,steps:40,colorAt:()=>[...P,1]});
  add(new THREE.CircleGeometry(.085,24),MAT.satin,0,.86,-.035,0,Math.PI).scale.set(1,1.35,1);   // intake
  add(new THREE.BoxGeometry(.14,.05,.09),MAT.yellow,0,1.0,.12);                                 // T-camera
  add(plate([[.35,.92],[1.95,.72],[1.95,.5],[1.0,.62]],.012),MAT.carbon);                       // shark fin
  // sidepods: coke-bottle taper toward the rear, white sweep on top
  for(const s of [1,-1]){paintLoft([{z:-.85,xc:s*.5,w:.2,ht:.15,hb:.15,yc:.42,n:3},{z:-.6,xc:s*.55,w:.25,ht:.17,hb:.19,yc:.4,n:3.4},
      {z:0,xc:s*.56,w:.27,ht:.15,hb:.24,yc:.37,n:3.6},{z:.7,xc:s*.5,w:.22,ht:.1,hb:.24,yc:.33,n:3.2},{z:1.3,xc:s*.4,w:.13,ht:.07,hb:.2,yc:.28,n:2.8},
      {z:1.75,xc:s*.3,w:.06,ht:.04,hb:.16,yc:.25,n:2.4}],{seg:36,steps:56,colorAt:(S,th)=>{const sn=Math.sin(th);if(sn<-.5)return CARBON;if(sn>.75&&S.z<.4)return ACCENT;return [...P,1];}});
    add(new THREE.CircleGeometry(1,32),MAT.satin,s*.5,.42,-.852,0,Math.PI).scale.set(.18,.13,1);   // radiator inlet
    add(new THREE.PlaneGeometry(.2,.15),MAT.number,s*.19,.36,-2.5,0,s*Math.PI/2);}                 // race number
  // cockpit opening, headrest
  add(new THREE.CylinderGeometry(.27,.27,.03,32),MAT.satin,0,.667,-.4).scale.set(1,1,1.55);
  add(new THREE.BoxGeometry(.5,.08,.22),MAT.satin,0,.69,.02);
  // halo
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(.33,.68,.12),V(.33,.86,-.18),V(.25,.93,-.55),V(0,.95,-.77),V(-.25,.93,-.55),V(-.33,.86,-.18),V(-.33,.68,.12)]),60,.033,12),MAT.carbon);
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(0,.95,-.77),V(0,.86,-.98),V(0,.66,-1.12)]),20,.036,12),MAT.carbon);
  // driver: helmet, visor, stripe
  {const h=new THREE.Group();h.position.set(0,.82,-.22);car.add(h);add(new THREE.SphereGeometry(.15,32,24),MAT.white,0,0,0,0,0,0,h);
    add(new THREE.SphereGeometry(.153,32,12,-.95,1.9,1.05,.55),MAT.visor,0,0,0,0,Math.PI,0,h);
    add(new THREE.TorusGeometry(.151,.012,8,40,Math.PI),MAT.solid,0,0,0,0,Math.PI/2,0,h);}
  // floor with edge wings and diffuser
  {const s=new THREE.Shape();[[-.62,1.25],[.62,1.25],[.7,-1.45],[.52,-2.05],[-.52,-2.05],[-.7,-1.45]].forEach(([x,y],k)=>k?s.lineTo(x,y):s.moveTo(x,y));s.closePath();
    const g=new THREE.ExtrudeGeometry(s,{depth:.025,bevelEnabled:false});g.rotateX(-Math.PI/2);add(g,MAT.carbon,0,.07,0);}
  add(plate([[1.55,.08],[2.15,.3],[2.15,.1],[1.55,.08]],.9),MAT.carbon);
  for(const s of [1,-1])add(plate([[1.6,.08],[2.15,.33],[2.15,.09]],.012),MAT.carbon,s*.45);
  // front wing: main plane + two flaps (inverted airfoils), curved endplates, nose pylons
  add(airfoil(.42,1.9,.1,-.05),MAT.carbon,0,.11,-4.02,-.05);
  add(airfoil(.24,1.84,.1,-.07),MAT.white,0,.17,-3.74,-.3);
  add(airfoil(.18,1.78,.1,-.07),MAT.carbon,0,.23,-3.58,-.55);
  for(const s of [1,-1]){add(plate([[-4.05,.04],[-4.05,.22],[-3.85,.3],[-3.4,.3],[-3.38,.06]],.012),MAT.carbon,s*.96);
    add(plate([[-3.55,.13],[-3.45,.3],[-3.25,.3],[-3.3,.13]],.01),MAT.satin,s*.09);}
  // rear wing: endplates with louvres, main plane + DRS flap, beam wing, pylon, rain light
  for(const s of [1,-1]){add(plate([[2.0,.38],[2.0,1.0],[2.12,1.07],[2.62,1.07],[2.62,.38]],.014),MAT.carbon,s*.48);
    for(let k=0;k<4;k++)add(new THREE.BoxGeometry(.016,.012,.3),MAT.satin,s*.48,.55+k*.1,2.35);}
  add(airfoil(.34,.94,.12,-.08),MAT.solid,0,.84,2.14,-.12);
  add(airfoil(.22,.94,.1,-.09),MAT.carbon,0,.99,2.4,-.55);
  add(airfoil(.2,.86,.1,-.06),MAT.carbon,0,.46,2.2,-.15);
  add(plate([[2.05,.4],[2.12,.84],[2.3,.84],[2.25,.4]],.04),MAT.satin);
  add(new THREE.BoxGeometry(.08,.08,.03),MAT.light,0,.5,2.47);
  // mirrors on stalks
  for(const s of [1,-1]){add(new THREE.SphereGeometry(1,20,12),MAT.solid,s*.56,.8,-.95).scale.set(.11,.045,.05);
    add(new THREE.PlaneGeometry(.17,.06),MAT.chrome,s*.56,.8,-.902);add(strut(V(s*.4,.66,-.93),V(s*.52,.79,-.95),.012,.5),MAT.carbon);}
  // wheels: rounded-shoulder tyres, yellow compound band, rims, flush wheel covers; push-rod suspension
  const tyre=(w,R)=>{const r0=R*.64,p=[[r0,-w/2],[R*.9,-w/2],[R*.975,-w/2+.025],[R,-w/2+.07],[R,w/2-.07],[R*.975,w/2-.025],[R*.9,w/2],[r0,w/2]];
    const g=new THREE.LatheGeometry(p.map(([r,y])=>new THREE.Vector2(r,y)),64);g.rotateZ(Math.PI/2);return g;};
  for(const [x,z,R,w] of [[.83,-1.8,.36,.31],[-.83,-1.8,.36,.31],[.79,1.8,.37,.41],[-.79,1.8,.37,.41]]){
    const g=new THREE.Group();g.position.set(x,R,z);car.add(g);const s=Math.sign(x);
    add(tyre(w,R),MAT.rubber,0,0,0,0,0,0,g);
    for(const f of [1,-1]){add(new THREE.RingGeometry(R*.76,R*.82,64),MAT.yellow,f*(w/2+.002),0,0,0,f*Math.PI/2,0,g);
      add(new THREE.CircleGeometry(R*.66,48),MAT.cover,f*(w/2-.01),0,0,0,f*Math.PI/2,0,g);
      add(new THREE.RingGeometry(R*.6,R*.64,48),MAT.rim,f*(w/2-.005),0,0,0,f*Math.PI/2,0,g);}
    add(new THREE.CylinderGeometry(.045,.045,w+.02,16),MAT.chrome,0,0,0,0,0,Math.PI/2,g);   // wheel nut
    // wishbones and push-rod (aero-section)
    const hx=x-s*w/2,fz=z<0;
    add(strut(V(hx,R+.11,z),V(s*.36,.6,z-.38),.02),MAT.carbon);add(strut(V(hx,R+.11,z),V(s*.36,.6,z+.38),.02),MAT.carbon);
    add(strut(V(hx,R-.13,z),V(s*.34,.3,z-.42),.02),MAT.carbon);add(strut(V(hx,R-.13,z),V(s*.34,.3,z+.42),.02),MAT.carbon);
    add(strut(V(hx,R-.1,z),V(s*.3,fz?.62:.55,z+(fz?.25:-.25)),.014),MAT.satin);
    if(fz)add(plate([[z-.18,.18],[z-.18,.32],[z+.12,.36],[z+.12,.2]],.01),MAT.carbon,s*(Math.abs(x)-w/2-.04));}   // brake-duct winglet
  car.userData={paintGeos,parts};return car;}
function recolor(car){const P=hexRGB(livery[0]);MAT.solid.color.setHex(livery[0]);car.userData.paintGeos.forEach(g=>{const c=g.attributes.color;g.userData.paintIdx.forEach(i=>c.setXYZ(i,P[0],P[1],P[2]));c.needsUpdate=true;});}

/* ---------------- current game model (same parts as the game's AI cars) ---------------- */
function buildCurrent(){
  const g=new THREE.Group(),std=(c,r,mt=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:mt});
  const M={paint:std(livery[0],.3,.25),white:std(0xf2f2f2,.35),dark:std(0x17181b,.55,.2),tyre:std(0x121214,.95),rim:std(0x2b2d31,.3,.8),glass:std(0x0d1116,.08,.6),tail:new THREE.MeshBasicMaterial({color:0xff2a1a}),band:new THREE.MeshBasicMaterial({color:0xf3c614})};
  let parts=0;const put=(geo,mat,x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.scale.set(sx,sy,sz);m.castShadow=m.receiveShadow=true;g.add(m);parts++;return m;};
  const box=(w,h,l,mat,x,y,z,rx=0,ry=0,rz=0)=>put(new THREE.BoxGeometry(w,h,l),mat,x,y,z,rx,ry,rz);
  const rod=(a,b,r,mat)=>{const m=strut(a,b,r,1);m.material=mat;m.castShadow=true;g.add(m);parts++;};
  const wheel=(x,z,r,w)=>{const s=Math.sign(x),face=x+s*(w/2+.004);put(new THREE.CylinderGeometry(r,r,w,22),M.tyre,x,r,z,0,0,Math.PI/2);
    put(new THREE.CircleGeometry(r*.68,18),M.rim,face,r,z,0,s*Math.PI/2);put(new THREE.RingGeometry(r*.74,r*.84,22),M.band,face+s*.002,r,z,0,s*Math.PI/2);};
  box(1.3,.05,3.9,M.dark,0,.1,.15);put(new THREE.CylinderGeometry(.08,.25,2.0,16),M.paint,0,.36,-2.05,-Math.PI/2,0,0,1,1,.6);
  box(.78,.5,2.2,M.paint,0,.45,-.2);box(.46,.05,.72,M.dark,0,.71,-.3);put(new THREE.SphereGeometry(.16,14,10),M.white,0,.84,-.12);box(.22,.06,.1,M.glass,0,.86,-.26);
  put(new THREE.TorusGeometry(.3,.028,6,20,Math.PI),M.dark,0,.98,-.12,-Math.PI/2);rod(V(0,.72,-.62),V(0,.98,-.42),.03,M.dark);[-1,1].forEach(s=>rod(V(s*.3,.98,-.12),V(s*.3,.72,-.05),.025,M.dark));
  box(.32,.36,.45,M.paint,0,1.0,.32);box(.24,.2,.04,M.dark,0,1.06,.09);put(new THREE.CylinderGeometry(.1,.4,1.7,16),M.paint,0,.62,1.05,Math.PI/2,0,0,.8,1,.9);box(.03,.4,1.1,M.paint,0,.9,1.2);
  [-1,1].forEach(s=>{box(.5,.4,1.4,M.paint,s*.62,.42,.15);box(.42,.3,.05,M.dark,s*.62,.44,-.56);box(.38,.26,.8,M.paint,s*.56,.36,1.2);box(.5,.025,.3,M.white,s*.62,.63,-.05);
    box(.03,.26,.55,M.paint,s*.97,.22,-2.95);box(.03,.55,.62,M.paint,s*.52,.9,2.3);box(.15,.07,.05,M.paint,s*.48,.82,-.62);rod(V(s*.36,.7,-.6),V(s*.45,.8,-.62),.012,M.dark);
    const fh=V(s*.7,.45,-1.75),fl=V(s*.7,.25,-1.75),rh=V(s*.66,.45,1.55),rl=V(s*.66,.25,1.55);
    rod(V(s*.3,.55,-1.5),fh,.018,M.dark);rod(V(s*.3,.5,-2.0),fh,.018,M.dark);rod(V(s*.3,.3,-1.5),fl,.018,M.dark);rod(V(s*.3,.3,-2.0),fl,.018,M.dark);
    rod(V(s*.4,.5,1.3),rh,.018,M.dark);rod(V(s*.4,.5,1.8),rh,.018,M.dark);rod(V(s*.4,.3,1.3),rl,.018,M.dark);rod(V(s*.4,.3,1.8),rl,.018,M.dark);
    wheel(s*.82,-1.75,.33,.36);wheel(s*.8,1.55,.34,.44);});
  box(1.95,.04,.42,M.dark,0,.13,-3.0);box(1.85,.03,.2,M.paint,0,.2,-2.86,.35);box(1.05,.04,.34,M.dark,0,1.02,2.28);box(1.05,.03,.2,M.paint,0,1.12,2.38,-.35);
  box(.05,.42,.12,M.dark,0,.78,2.12);box(.9,.03,.18,M.dark,0,.5,2.3);box(1.0,.22,.35,M.dark,0,.2,2.15,-.35);box(.12,.06,.03,M.tail,0,.45,2.45);
  g.userData={parts,paintMat:M.paint};return g;}

/* ---------------- state & UI ---------------- */
const S={model:'new',view:'34',wire:false,spin:true};
let carNew=buildF1(),carOld=buildCurrent();scene.add(carNew,carOld);
const PARTS={new:'<b>개선 모델</b> · 단면을 이어 붙인 곡면 차체(노즈~엔진 커버, 사이드포드, 에어박스), 실제 날개 단면(에어포일) 모양의 앞뒤 날개, 휜 엔드플레이트, 어깨가 둥근 타이어와 휠 커버, 공력 단면 서스펜션, 헤일로·미러·T캠까지 코드로 생성했습니다.',
  old:'<b>현재 게임 모델</b> · 상자, 원기둥, 구를 조합한 모델입니다. 게임 속 AI 차는 이 부품들을 재질별로 합쳐서 차 한 대를 몇 번의 그리기 호출로 처리합니다.'};
function seg(el,items,key,after){el.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',String(S[key]===v));
  b.addEventListener('click',()=>{S[key]=v;[...el.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));after&&after();});el.appendChild(b);});}
function show(){carNew.visible=S.model==='new';carOld.visible=S.model==='old';$('parts').innerHTML=PARTS[S.model];}
seg($('segM'),[['old','현재 게임'],['new','개선 모델']],'model',show);
const VIEWS={'34':[2.35,.22,7.6],side:[Math.PI/2*0+0,.08,7.4],front:[-Math.PI/2,.1,7.2],rear:[Math.PI/2,.18,7.2],top:[0,1.45,8.2],close:[2.0,.12,3.6]};
seg($('segV'),[['34','3/4'],['side','옆'],['front','앞'],['rear','뒤'],['top','위'],['close','가까이']],'view',()=>{const v=VIEWS[S.view];orbit.tYaw=v[0];orbit.tPitch=v[1];orbit.tDist=v[2];S.spin=false;$('tSpin').setAttribute('aria-pressed','false');});
const SW=[0xc4101c,0x1e4fd8,0xf28c13,0x0f8a5f,0x9aa0a8,0x1a1a1d];
$('sw').innerHTML=SW.map((c,k)=>`<button class="sw" type="button" aria-label="도색 ${k+1}" aria-pressed="${k===0}" style="background:#${c.toString(16).padStart(6,'0')}"></button>`).join('');
[...$('sw').children].forEach((b,k)=>b.addEventListener('click',()=>{livery[0]=SW[k];[...$('sw').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));recolor(carNew);carOld.userData.paintMat.color.setHex(SW[k]);}));
$('tWire').addEventListener('click',()=>{S.wire=!S.wire;$('tWire').setAttribute('aria-pressed',String(S.wire));[carNew,carOld].forEach(c=>c.traverse(o=>{if(o.material)o.material.wireframe=S.wire;}));});
$('tSpin').addEventListener('click',()=>{S.spin=!S.spin;$('tSpin').setAttribute('aria-pressed',String(S.spin));});
show();

/* ---------------- orbit camera ---------------- */
const orbit={yaw:2.35,pitch:.22,dist:7.6,tYaw:2.35,tPitch:.22,tDist:7.6,drag:null};
canvas.addEventListener('pointerdown',e=>{orbit.drag={x:e.clientX,y:e.clientY,yaw:orbit.tYaw,pitch:orbit.tPitch};S.spin=false;$('tSpin').setAttribute('aria-pressed','false');try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!orbit.drag)return;orbit.tYaw=orbit.drag.yaw-(e.clientX-orbit.drag.x)*.007;orbit.tPitch=clamp(orbit.drag.pitch+(e.clientY-orbit.drag.y)*.005,.02,1.5);});
const end=()=>{orbit.drag=null;};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
canvas.addEventListener('wheel',e=>{e.preventDefault();orbit.tDist=clamp(orbit.tDist*(1+Math.sign(e.deltaY)*.08),2.6,16);},{passive:false});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now(),fps=60,frame=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;frame++;
  if(S.spin)orbit.tYaw+=dt*.25;const k=1-Math.exp(-dt*6);
  orbit.yaw+=(orbit.tYaw-orbit.yaw)*k;orbit.pitch+=(orbit.tPitch-orbit.pitch)*k;orbit.dist+=(orbit.tDist-orbit.dist)*k;
  const cx=Math.cos(orbit.yaw)*Math.cos(orbit.pitch),cz=Math.sin(orbit.yaw)*Math.cos(orbit.pitch);
  camera.position.set(cx*orbit.dist,.45+Math.sin(orbit.pitch)*orbit.dist,cz*orbit.dist-.3);camera.lookAt(0,.45,-.3);
  renderer.render(scene,camera);
  fps=fps*.93+(dt>0?1/dt:60)*.07;
  if(frame%15===0){const info=renderer.info.render;$('sTri').textContent=info.triangles.toLocaleString();$('sCall').textContent=info.calls;$('sFps').textContent=Math.round(fps);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
