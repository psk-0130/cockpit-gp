<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Cockpit GP 그래픽 랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D scene; one control sheet pinned top-left (bottom sheet on phones) in the game's own HUD style. Single dark look. */
:root{
  --panel:rgba(10,12,16,.82); --fg:#f3f2ee; --muted:#9ba1aa; --line:rgba(255,255,255,.14); --chip:#171a20;
  --red:#e10600; --amber:#ffc83d; --green:#22d36a;
  --display:"Titillium Web","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#0b0d10;color:var(--fg);overflow:hidden;font-family:var(--display)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(8px)}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#ui{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;width:330px;max-height:calc(100% - 32px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;z-index:2}
#ui h1{margin:0;font-size:24px;font-weight:900;line-height:1.1;text-wrap:balance}
#ui h1 span{color:var(--red)}
#ui p{margin:0;font-size:13px;line-height:1.5;color:#cfd0cc}
.sec{display:flex;flex-direction:column;gap:7px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{font:700 13px var(--display);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:8px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--red);background:rgba(225,6,0,.2)}
.seg.big button{font-size:15px;padding:10px 6px}
.fx{display:flex;flex-direction:column;gap:4px}
.fx label{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--chip);cursor:pointer}
.fx input{margin:3px 0 0;accent-color:var(--red);grid-row:span 2}
.fx b{font-size:13px}
.fx small{font-size:12px;color:var(--muted);line-height:1.35}
.fx.off{opacity:.45;pointer-events:none}
button:focus-visible,.fx label:focus-within{outline:2px solid var(--fg);outline-offset:2px}
#hudR{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;padding:8px 12px;z-index:2;text-align:right;pointer-events:none}
#fps{font-size:20px;font-weight:600}
#badge{font-size:12px;color:var(--amber)}
#hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;padding:7px 11px;font-size:12px;color:var(--muted);z-index:2;pointer-events:none}
#toggleUi{display:none}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center}
@media (max-width:700px){
  #ui{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;width:auto;max-height:52%;padding:12px;gap:10px}
  #ui.collapsed .more{display:none}
  #toggleUi{display:block;font:700 12px var(--display);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 10px;align-self:flex-start}
  #hint{display:none}
  #ui h1{font-size:20px}
}
</style>

<canvas id="gl"></canvas>

<div id="ui" class="panel">
  <div class="sec">
    <div class="lbl">Cockpit GP · 그래픽 랩</div>
    <h1>Three.js로 <span>어디까지</span> 될까</h1>
    <p class="more">같은 트랙, 같은 웹 기술(Three.js)입니다. 아래에서 <b>현재 게임</b>과 <b>개선 버전</b>을 바꿔 보고, 효과를 하나씩 끄면서 무엇이 달라지는지 확인하세요.</p>
  </div>
  <div class="sec">
    <div class="lbl">그래픽</div>
    <div class="seg big" id="segQ"></div>
  </div>
  <button id="toggleUi" type="button">설정 접기</button>
  <div class="sec more">
    <div class="lbl">개선 효과 · 하나씩 꺼 보기</div>
    <div class="fx" id="fx"></div>
  </div>
  <div class="sec more">
    <div class="lbl">시간대</div>
    <div class="seg" id="segT"></div>
  </div>
  <div class="sec">
    <div class="lbl">카메라</div>
    <div class="seg" id="segC"></div>
  </div>
</div>

<div id="hudR" class="panel"><div class="lbl">성능</div><div id="fps" class="num">– FPS</div><div id="badge"></div></div>
<div id="hint" class="panel">드래그: 돌려 보기 · 휠: 확대/축소</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE||!THREE.Sky||!THREE.EffectComposer){document.body.insertAdjacentHTML('beforeend','<div id="err" class="panel">3D 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.</div>');return;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------------- state ---------------- */
const S={q:'adv',time:'sunset',cam:'orbit',fx:{sky:true,shadow:true,env:true,pbr:true,tone:true,bloom:true}};
const FX=[['sky','하늘 셰이더','대기 산란을 계산해 시간대마다 실제 같은 하늘색과 태양을 그립니다.'],
  ['shadow','그림자','태양 방향으로 차·나무·관중석의 그림자를 땅에 드리웁니다.'],
  ['env','반사 (환경맵)','하늘을 차체 도장과 금속에 비춰서 광택이 생깁니다.'],
  ['pbr','PBR 재질','도장·카본·고무·아스팔트를 물리 기반으로 표현하고, 노면 요철(노멀맵)을 넣습니다.'],
  ['tone','톤 매핑 (ACES)','아주 밝은 햇빛을 화면에 자연스럽게 눌러 담습니다. 끄면 하얗게 날아갑니다.'],
  ['bloom','블룸','태양, 출발 신호등, 후미등처럼 밝은 빛이 번져 보이게 합니다.']];
const TIMES={
  day:   {label:'한낮',envI:.28,elev:50,azim:150,turb:2.5,ray:.9,mie:.003,mieG:.8, exp:.42,sun:0xfff1dc,sunI:2.1,hs:0xbfd8ff,hg:0x4a5a2a,hi:.32,fog:0xa9c6e2,fogN:400,fogF:3400,flat:0xa8cbe6,bloom:.3},
  sunset:{label:'노을',envI:.7,elev:4, azim:255,turb:10,ray:3,  mie:.006,mieG:.93,exp:.52,sun:0xffa060,sunI:2.3,hs:0xffc79a,hg:0x3a3222,hi:.3, fog:0xd89a76,fogN:250,fogF:2600,flat:0xe7a77c,bloom:.6},
  cloudy:{label:'흐림',envI:.45,elev:35,azim:150,turb:20,ray:4,  mie:.02, mieG:.7, exp:.55,sun:0xdfe5ec,sunI:.8, hs:0xd5dbe2,hg:0x505548,hi:.95,fog:0xa9afb6,fogN:60, fogF:900, flat:0xb0b6bd,bloom:.25}};

/* ---------------- renderer, scene ---------------- */
const canvas=$('gl');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err" class="panel">이 브라우저에서 WebGL을 사용할 수 없습니다.</div>');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,.05,12000);
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);scene.add(sun);scene.add(sun.target);
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:400});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;

// textures (all generated, nothing downloaded)
function canvasTex(size,draw,{srgb=false,rep=1}={}){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=renderer.capabilities.getMaxAnisotropy();if(srgb)t.encoding=THREE.sRGBEncoding;return t;}
function smoothNoise(n,blur){let a=new Float32Array(n*n).map(()=>Math.random());
  for(let k=0;k<blur;k++){const b=new Float32Array(n*n);for(let y=0;y<n;y++)for(let x=0;x<n;x++){let s=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=a[((y+dy+n)%n)*n+(x+dx+n)%n];b[y*n+x]=s/9;}a=b;}
  let lo=1,hi=0;a.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v);});return a.map(v=>(v-lo)/(hi-lo||1));}
const pix=(g,n,fn)=>{const img=g.createImageData(n,n);for(let y=0;y<n;y++)for(let x=0;x<n;x++){const o=(y*n+x)*4,c=fn(x,y);img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;}g.putImageData(img,0,0);};
// current-game style flat noise
const oldGrass=canvasTex(64,(g,n)=>pix(g,n,(x,y)=>{const v=(Math.random()-.5)*22+((y>>5)&1?10:0);return [78+v,118+v,48+v];}),{rep:300});
const oldAsphalt=canvasTex(128,(g,n)=>pix(g,n,()=>{const v=(Math.random()-.5)*26;return [62+v,64+v,69+v];}));
// improved asphalt: aggregate colour, height-derived normal map, roughness
const ASN=256,aH=smoothNoise(ASN,2),aFine=new Float32Array(ASN*ASN).map(()=>Math.random());
const asColor=canvasTex(ASN,(g,n)=>pix(g,n,(x,y)=>{const i=y*n+x,s=aFine[i]>.985?45:0,v=48+aH[i]*14+(aFine[i]-.5)*16+s;return [v,v+1,v+4];}),{srgb:true});
const asNormal=canvasTex(ASN,(g,n)=>pix(g,n,(x,y)=>{const h=(xx,yy)=>aH[((yy+n)%n)*n+(xx+n)%n]*.6+aFine[((yy+n)%n)*n+(xx+n)%n]*.4;
  const dx=(h(x-1,y)-h(x+1,y))*2.2,dy=(h(x,y-1)-h(x,y+1))*2.2,l=Math.hypot(dx,dy,1);return [(dx/l*.5+.5)*255,(dy/l*.5+.5)*255,(1/l*.5+.5)*255];}));
const asRough=canvasTex(ASN,(g,n)=>pix(g,n,(x,y)=>{const v=200+aH[y*n+x]*40-(aFine[y*n+x]>.985?60:0);return [v,v,v];}));
const grassN=smoothNoise(128,3);
const grassTex=canvasTex(128,(g,n)=>pix(g,n,(x,y)=>{const v=grassN[y*n+x],stripe=(y>>6)&1?12:-6,r=Math.random()*10;return [52+v*30+stripe+r,96+v*40+stripe+r,34+v*18+stripe*.5];}),{srgb:true,rep:240});
const carbonTex=canvasTex(64,(g)=>{for(let y=0;y<8;y++)for(let x=0;x<8;x++){const odd=(x+y)%2,v=odd?44:26;g.fillStyle=`rgb(${v},${v+1},${v+5})`;g.fillRect(x*8,y*8,8,8);
  const gr=g.createLinearGradient(x*8,y*8,x*8+(odd?8:0),y*8+(odd?0:8));gr.addColorStop(0,'rgba(255,255,255,.12)');gr.addColorStop(1,'rgba(0,0,0,.2)');g.fillStyle=gr;g.fillRect(x*8,y*8,8,8);}},{srgb:true,rep:6});
const bannerTex=(()=>{const c=document.createElement('canvas');c.width=1024;c.height=96;const g=c.getContext('2d');g.fillStyle='#14306b';g.fillRect(0,0,1024,96);
  g.fillStyle='#e10600';g.fillRect(0,0,1024,8);g.fillStyle='#fff';g.font='900 56px "Titillium Web",sans-serif';g.textBaseline='middle';
  g.fillText('COCKPIT GP',30,52);g.fillText('GRAPHICS LAB',560,52);const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;})();

/* ---------------- dual materials: current-game look vs improved ---------------- */
const dualList=[];
const lam=(color,extra={})=>new THREE.MeshLambertMaterial({color,...extra});
function dual(mesh,basic,adv){mesh.material=adv;dualList.push({mesh,basic,adv});return mesh;}
const M={
  paint:new THREE.MeshPhysicalMaterial({color:0xb30d18,metalness:.25,roughness:.3,clearcoat:1,clearcoatRoughness:.06}),
  white:new THREE.MeshPhysicalMaterial({color:0xf1efe9,metalness:.1,roughness:.32,clearcoat:.9,clearcoatRoughness:.08}),
  carbon:new THREE.MeshStandardMaterial({map:carbonTex,roughness:.35,metalness:.25}),
  rubber:new THREE.MeshStandardMaterial({color:0x121214,roughness:.88}),
  rim:new THREE.MeshStandardMaterial({color:0x1d1f22,metalness:.9,roughness:.28}),
  metal:new THREE.MeshStandardMaterial({color:0x9aa1a8,metalness:1,roughness:.22}),
  visor:new THREE.MeshPhysicalMaterial({color:0x101114,metalness:.9,roughness:.04,clearcoat:1}),
  yellow:new THREE.MeshStandardMaterial({color:0xf3c614,roughness:.5}),
  redLight:new THREE.MeshStandardMaterial({color:0x330000,emissive:0xff2a1a,emissiveIntensity:5}),
};
const L={paint:lam(0xb30d18),white:lam(0xeeeeee),carbon:lam(0x1d1f23),rubber:lam(0x111111),rim:lam(0x222222),metal:lam(0x9aa1a8),visor:lam(0x111111),yellow:lam(0xf3c614),redLight:lam(0xff2a1a)};
const part=(geo,key,parent,x=0,y=0,z=0,rx=0,ry=0,rz=0)=>{const m=dual(new THREE.Mesh(geo,M[key]),L[key],M[key]);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;};

/* ---------------- track ---------------- */
const HALF=6.5,KERB=1.5;
const CTRL=[[0,0],[300,0],[420,40],[460,140],[400,230],[250,250],[150,330],[160,430],[260,480],[380,470],[430,560],[360,640],[150,640],[-20,560],[-80,420],[-60,250],[-120,140],[-90,40]];
const curve=new THREE.CatmullRomCurve3(CTRL.map(p=>new THREE.Vector3(p[0],0,-p[1])),true,'centripetal');
const LEN=curve.getLength(),N=Math.round(LEN/2),DS=LEN/N,P=curve.getSpacedPoints(N);P.pop();
const T=[],R=[],K=[];
for(let i=0;i<N;i++){const t=new THREE.Vector3().subVectors(P[(i+1)%N],P[(i-1+N)%N]).normalize();T.push(t);R.push(new THREE.Vector3(-t.z,0,t.x));}
for(let i=0;i<N;i++){const a=T[(i-4+N)%N],b=T[(i+4)%N];const ang=Math.acos(clamp(a.dot(b),-1,1));K.push((Math.sign(new THREE.Vector3().subVectors(b,a).dot(R[i]))||1)*ang/(8*DS));}
const headingOf=i=>Math.atan2(T[i].x,-T[i].z);
const pt=(i,o,y)=>new THREE.Vector3(P[i].x+R[i].x*o,y,P[i].z+R[i].z*o);
const cells=new Map(),CELL=40;P.forEach((p,i)=>{const k=Math.floor(p.x/CELL)+','+Math.floor(p.z/CELL);if(!cells.has(k))cells.set(k,[]);cells.get(k).push(i);});
function nearTrack(x,z,r,skipI=-1){const gx=Math.floor(x/CELL),gz=Math.floor(z/CELL),sp=Math.ceil(r/CELL);
  for(let a=-sp;a<=sp;a++)for(let b=-sp;b<=sp;b++){const l=cells.get((gx+a)+','+(gz+b));if(!l)continue;
    for(const j of l){if(skipI>=0){const d=Math.abs(j-skipI);if(Math.min(d,N-d)<r/DS*1.6+15)continue;}const dx=P[j].x-x,dz=P[j].z-z;if(dx*dx+dz*dz<r*r)return true;}}return false;}
function strip(offA,offB,yA,yB,colorAt,uv){const pos=[],col=[],uvs=[];
  for(let i=0;i<N;i++){const c=colorAt(i);if(!c)continue;const j=(i+1)%N;
    const a0=pt(i,offA,yA),b0=pt(i,offB,yB),a1=pt(j,offA,yA),b1=pt(j,offB,yB);
    [a0,b0,b1,a0,b1,a1].forEach(v=>pos.push(v.x,v.y,v.z));for(let k=0;k<6;k++)col.push(c.r,c.g,c.b);   // counter-clockwise from above = faces up
    if(uv){const v0=i*DS/10,v1=(i+1)*DS/10;uvs.push(0,v0,1,v0,1,v1,0,v0,1,v1,0,v1);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  if(uv)g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));g.computeVertexNormals();return g;}
const C=h=>new THREE.Color(h);
// ground
{const gm=dual(new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),null),lam(0xffffff,{map:oldGrass}),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}));
  gm.rotation.x=-Math.PI/2;gm.position.set(170,-.01,-320);gm.receiveShadow=true;scene.add(gm);}
// asphalt
{const g=strip(-HALF,HALF,.02,.02,()=>C(0xffffff),true);
  const adv=new THREE.MeshStandardMaterial({map:asColor,normalMap:asNormal,roughnessMap:asRough,roughness:1,normalScale:new THREE.Vector2(.35,.35)});
  const m=dual(new THREE.Mesh(g,null),lam(0xffffff,{map:oldAsphalt}),adv);m.receiveShadow=true;scene.add(m);}
// white edge lines, kerbs (raised and sloped), start line
const kerb=new Array(N).fill(false);for(let i=0;i<N;i++)if(Math.abs(K[i])>1/160)for(let k=-8;k<=8;k++)kerb[(i+k+N)%N]=true;
const kc=i=>kerb[i]?((Math.floor(i/2)%2)?C(0xf2f2f2):C(0xd2201a)):null;
[[-HALF+.1,-HALF+.32,()=>C(0xf2f2f2),.03,.03],[HALF-.32,HALF-.1,()=>C(0xf2f2f2),.03,.03],[HALF,HALF+KERB,kc,.03,.1],[-HALF-KERB,-HALF,kc,.1,.03],[-HALF,HALF,i=>i===0||i===1?C(0xf2f2f2):null,.035,.035]].forEach(([a,b,f,ya,yb])=>{
  const m=dual(new THREE.Mesh(strip(a,b,ya,yb,f),null),lam(0xffffff,{vertexColors:true}),new THREE.MeshStandardMaterial({vertexColors:true,roughness:.55}));m.receiveShadow=true;scene.add(m);});
// armco barriers on posts, banners on the main straight
{const pos=[],posts=[];for(const side of [-1,1])for(let i=0;i<N;i+=1){const off=side*(HALF+16);const p=pt(i,off,0);if(nearTrack(p.x,p.z,HALF+6,i))continue;
    const j=(i+1)%N,a=pt(i,off,.35),b=pt(j,off,.35),a2=pt(i,off,.8),b2=pt(j,off,.8);[a,b,b2,a,b2,a2].forEach(v=>pos.push(v.x,v.y,v.z));if(i%2===0)posts.push(p);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();
  const m=dual(new THREE.Mesh(g,null),lam(0xa9aeb4,{side:THREE.DoubleSide}),new THREE.MeshStandardMaterial({color:0xb7bcc2,metalness:.85,roughness:.32,side:THREE.DoubleSide}));m.castShadow=true;m.receiveShadow=true;scene.add(m);

  const dt=Math.min(.05,(now-last)/1000);last=now;frame++;
  // the car drives in chase/cockpit view and rolls slowly in orbit view
  let k=0;const i0=Math.floor(drive.s/DS)%N;for(let j=0;j<45;j++)k=Math.max(k,Math.abs(K[(i0+j)%N]));
  const vT=S.cam==='orbit'?0:Math.min(80,Math.sqrt(26/Math.max(k,1e-4)));drive.v+=clamp(vT-drive.v,-28*dt,9*dt);drive.s=(drive.s+drive.v*dt)%LEN;
  const pose=carPose(drive.s);carRoot.position.set(pose.x,0,pose.z);carRoot.rotation.y=-pose.h;
  const steerA=clamp(Math.atan(K[pose.i]*3.6)*1.4,-.35,.35);
  wheels.forEach(w=>{w.spin.rotation.x-=drive.v/w.R*dt;if(w.front)w.steer.rotation.y=-steerA;});
  const fwd=new THREE.Vector3(Math.sin(pose.h),0,-Math.cos(pose.h));
  helmet.visible=S.cam!=='cockpit';
  if(S.cam==='orbit'){if(!orbit.drag){orbit.idle+=dt;if(orbit.idle>2.5)orbit.yaw+=dt*.12;}
    camera.fov=45;camPos.set(pose.x+Math.cos(orbit.yaw)*Math.cos(orbit.pitch)*orbit.dist,.6+Math.sin(orbit.pitch)*orbit.dist,pose.z+Math.sin(orbit.yaw)*Math.cos(orbit.pitch)*orbit.dist);
    camera.position.copy(camPos);camera.lookAt(pose.x,.55,pose.z);}
  else if(S.cam==='chase'){camera.fov=60;const want=new THREE.Vector3(pose.x,2.4,pose.z).addScaledVector(fwd,-8.5);camPos.lerp(want,1-Math.exp(-dt*6));
    camera.position.copy(camPos);camLook.set(pose.x,.9,pose.z).addScaledVector(fwd,8);camera.lookAt(camLook);}
  else{camera.fov=76;const head=new THREE.Vector3(0,.95,-.2).applyMatrix4(carRoot.matrixWorld);camera.position.copy(head);camLook.copy(head).addScaledVector(fwd,10);camLook.y-=.6;camera.lookAt(camLook);camPos.copy(head);}
  camera.updateProjectionMatrix();
  // keep the shadow map centred on the car
  sun.position.set(pose.x,0,pose.z).addScaledVector(sunDir,180);sun.target.position.set(pose.x,0,pose.z);
  if(useComposer)composer.render(dt);else renderer.render(scene,camera);
  fpsAvg=fpsAvg*.93+(dt>0?1/dt:60)*.07;if(frame%15===0)$('fps').textContent=Math.round(fpsAvg)+' FPS';
  requestAnimationFrame(loop);
}
setSky(TIMES[S.time]);apply();resize();requestAnimationFrame(loop);
})();
